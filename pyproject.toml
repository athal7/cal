[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-automation"
version = "0.1.0"
description = "Calendar automations backed by ical and chezmoi data"
requires-python = ">=3.11"
dependencies = ["icalendar>=6,<8"]

[project.scripts]
cal-automation = "cal.__main__:main"

[tool.setuptools]
packages = ["cal"]
