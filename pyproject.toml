[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-automation"
dynamic = ["version"]
description = "Calendar automations backed by ical and XDG configuration"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["icalendar>=6,<8"]

[project.scripts]
cal-automation = "cal.__main__:main"

[tool.setuptools]
packages = ["cal"]

[tool.setuptools_scm]
